name: Deploy Fetch Data Lambda

on:
  push:
    paths:
      - 'lambda-fetch-data/**'
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: fetch-fx-data
  S3_DEPLOY_BUCKET: graph-arbitrage-lambda-852815611756

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Lambda package with Docker
      run: |
        cd lambda-fetch-data
        docker build -t lambda-builder .
        docker create --name lambda-container lambda-builder
        docker cp lambda-container:/asset/deployment-package.zip ./
        docker rm lambda-container
        ls -la

    - name: Upload to S3 and update Lambda
      run: |
        cd lambda-fetch-data
        TIMESTAMP=$(date +%s)
        S3_KEY="fetch-fx-data/deployment-package-${TIMESTAMP}.zip"
        
        # Upload to S3
        aws s3 cp deployment-package.zip "s3://${S3_DEPLOY_BUCKET}/${S3_KEY}"
        
        # Update Lambda function
        aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --s3-bucket $S3_DEPLOY_BUCKET \
          --s3-key $S3_KEY

    - name: Wait for update to complete
      run: |
        sleep 10

    - name: Test Lambda function
      run: |
        aws lambda invoke \
          --function-name $LAMBDA_FUNCTION_NAME \
          --invocation-type RequestResponse \
          --payload '{}' \
          response.json
        echo "Lambda response:"
        cat response.json
        
        # Check if the invocation was successful
        if [ $? -eq 0 ]; then
          echo "✅ Lambda test passed"
        else
          echo "❌ Lambda test failed"
          exit 1
        fi

    - name: Verify S3 data creation
      run: |
        echo "Checking for new data in S3:"
        aws s3 ls s3://graph-arbitrage-raw-data-se/ --recursive
